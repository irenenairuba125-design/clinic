{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{% if object %}Edit Patient{% else %}Register Patient{% endif %}{% endblock %}
{% block content %}
<h3 class="mb-3">{% if object %}Edit Patient - {{ object.full_name }}{% else %}Register Patient{% endif %}</h3>
<div class="card">
    <div class="card-body">
        {% crispy form %}
    </div>
</div>
{% endblock %}
