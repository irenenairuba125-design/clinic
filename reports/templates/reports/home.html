{% extends "base.html" %}
{% block title %}Reports{% endblock %}
{% block content %}
<h3 class="mb-4">Reports</h3>
<div class="row g-3">
    <div class="col-md-6 col-lg-3">
        <a href="{% url 'reports:patient_register' %}" class="text-decoration-none">
            <div class="card h-100 text-center p-3">
                <i class="bi bi-people fs-1 text-primary"></i>
                <h5 class="mt-2">Patient Register</h5>
            </div>
        </a>
    </div>
    <div class="col-md-6 col-lg-3">
        <a href="{% url 'reports:appointments' %}" class="text-decoration-none">
            <div class="card h-100 text-center p-3">
                <i class="bi bi-calendar-check fs-1 text-primary"></i>
                <h5 class="mt-2">Appointment Report</h5>
            </div>
        </a>
    </div>
    <div class="col-md-6 col-lg-3">
        <a href="{% url 'reports:visits' %}" class="text-decoration-none">
            <div class="card h-100 text-center p-3">
                <i class="bi bi-clipboard2-pulse fs-1 text-primary"></i>
                <h5 class="mt-2">Visit Report</h5>
            </div>
        </a>
    </div>
    <div class="col-md-6 col-lg-3">
        <a href="{% url 'reports:laboratory' %}" class="text-decoration-none">
            <div class="card h-100 text-center p-3">
                <i class="bi bi-flask fs-1 text-primary"></i>
                <h5 class="mt-2">Laboratory Report</h5>
            </div>
        </a>
    </div>
</div>
{% endblock %}
